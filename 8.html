<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        input[type="number"], button {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔢 終極密碼遊戲</h1>
        <p>猜一個介於 <span id="min_range">1</span> 到 <span id="max_range">100</span> 之間的數字。</p>

        <input type="number" id="guessInput" min="1" max="100" placeholder="輸入你的猜測">
        <button onclick="checkGuess()">猜測</button>
        <button onclick="resetGame()">重新開始</button>

        <p id="message"></p>
        <p>剩餘次數: <span id="attemptsLeft">7</span></p>
    </div>

    <script>
        // --- 遊戲變數 ---
        let secretNumber;
        let minRange = 1;
        let maxRange = 100;
        let attempts = 0;
        const MAX_ATTEMPTS = 7; // 設定最大嘗試次數

        // --- 初始化函數 ---
        function initializeGame() {
            // 生成 1 到 100 之間的隨機整數
            secretNumber = Math.floor(Math.random() * 100) + 1;
            minRange = 1;
            maxRange = 100;
            attempts = 0;

            // 更新 HTML 顯示
            document.getElementById('min_range').textContent = minRange;
            document.getElementById('max_range').textContent = maxRange;
            document.getElementById('message').textContent = "開始遊戲！";
            document.getElementById('attemptsLeft').textContent = MAX_ATTEMPTS;
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.querySelector('button[onclick="checkGuess()"]').disabled = false;

            console.log("密碼已生成：", secretNumber); // 方便測試，實際遊戲中應移除
        }

        // --- 檢查猜測函數 ---
        function checkGuess() {
            const guessInput = document.getElementById('guessInput');
            const guess = parseInt(guessInput.value);
            const messageElement = document.getElementById('message');

            // 檢查輸入是否有效
            if (isNaN(guess) || guess < minRange || guess > maxRange) {
                messageElement.textContent = `請輸入一個介於 ${minRange} 到 ${maxRange} 之間的有效數字！`;
                return;
            }

            attempts++;
            const attemptsLeftElement = document.getElementById('attemptsLeft');
            attemptsLeftElement.textContent = MAX_ATTEMPTS - attempts;

            if (guess === secretNumber) {
                // 猜對了！
                messageElement.textContent = `🎉 恭喜你！密碼就是 ${secretNumber}！你用了 ${attempts} 次猜對了！`;
                gameOver(true);
            } else if (guess < secretNumber) {
                // 猜太低
                messageElement.textContent = `太低了！密碼介於 ${guess + 1} 到 ${maxRange} 之間。`;
                minRange = guess + 1;
            } else if (guess > secretNumber) {
                // 猜太高
                messageElement.textContent = `太高了！密碼介於 ${minRange} 到 ${guess - 1} 之間。`;
                maxRange = guess - 1;
            }

            // 更新範圍提示
            document.getElementById('min_range').textContent = minRange;
            document.getElementById('max_range').textContent = maxRange;

            // 清空輸入框準備下次猜測
            guessInput.value = '';

            // 檢查是否超過最大嘗試次數
            if (attempts >= MAX_ATTEMPTS && guess !== secretNumber) {
                messageElement.textContent = `😭 遊戲結束！你用完了所有 ${MAX_ATTEMPTS} 次機會。密碼是 ${secretNumber}。`;
                gameOver(false);
            }
        }

        // --- 遊戲結束處理 ---
        function gameOver(isWon) {
            document.getElementById('guessInput').disabled = true;
            document.querySelector('button[onclick="checkGuess()"]').disabled = true;
            if (isWon) {
                document.getElementById('message').style.color = 'green';
            } else {
                document.getElementById('message').style.color = 'red';
            }
        }

        // --- 重新開始函數 ---
        function resetGame() {
            document.getElementById('message').style.color = 'black';
            initializeGame();
        }

        // 頁面加載完成後自動開始遊戲
        window.onload = initializeGame;
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        input[type="number"], button {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔢 終極密碼遊戲</h1>
        <p>猜一個介於 <span id="min_range">1</span> 到 <span id="max_range">100</span> 之間的數字。</p>

        <input type="number" id="guessInput" min="1" max="100" placeholder="輸入你的猜測">
        <button onclick="checkGuess()">猜測</button>
        <button onclick="resetGame()">重新開始</button>

        <p id="message"></p>
        <p>剩餘次數: <span id="attemptsLeft">∞</span></p> 
    </div>

    <script>

        let secretNumber;
        let minRange = 1;
        let maxRange = 100;
        let attempts = 0;

        // --- 初始化函數 ---
        function initializeGame() {
            // 生成 1 到 100 之間的隨機整數
            secretNumber = Math.floor(Math.random() * 100) + 1;
            minRange = 1;
            maxRange = 100;
            attempts = 0;

            // 更新 HTML 顯示
            document.getElementById('min_range').textContent = minRange;
            document.getElementById('max_range').textContent = maxRange;
            document.getElementById('message').textContent = "開始遊戲！";
            document.getElementById('attemptsCount').textContent = attempts;
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.querySelector('button[onclick="checkGuess()"]').disabled = false;

            console.log("密碼已生成：", secretNumber); // 方便測試，實際遊戲中應移除
        }

            const guess = parseInt(guessInput.value);
